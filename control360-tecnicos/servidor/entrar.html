<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Técnicos · {{EMPRESA}}</title>
<style>
  :root { --fondo:#eef2f6; --carta:#fff; --texto:#1f2a37; --suave:#64748b; --acento:#3b7a8c; --borde:#d9e1ea; --error:#b4443d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--fondo);
         font:18px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--texto); padding:16px; }
  form { background:var(--carta); padding:32px 28px; border-radius:18px; width:100%; max-width:380px;
         box-shadow:0 8px 30px rgba(30,50,70,.08); }
  h1 { margin:0 0 4px; font-size:26px; }
  p { margin:0 0 22px; color:var(--suave); }
  input { width:100%; font-size:20px; padding:14px; border:1px solid var(--borde); border-radius:12px; }
  button { width:100%; margin-top:16px; font-size:20px; padding:14px; border:0; border-radius:12px;
           background:var(--acento); color:#fff; font-weight:600; cursor:pointer; }
  .error { color:var(--error); margin-top:12px; min-height:1em; }
</style>
</head>
<body>
<form method="post">
  <h1>Técnicos en campo</h1>
  <p>CONTROL360 · {{EMPRESA}}</p>
  <input type="password" name="clave" placeholder="Clave del panel" autofocus>
  <button>Entrar</button>
  <div class="error">{{ERROR}}</div>
</form>
</body>
</html>
