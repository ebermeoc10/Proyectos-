plugins { id 'com.android.application' }
def appName = project.findProperty('appName') ?: 'Radio'
def appId = project.findProperty('appId') ?: 'ec.goolnet.radio.demo'
def appVersion = (project.findProperty('appVersion') ?: '1').toInteger()
android {
    namespace 'ec.goolnet.radios'
    compileSdk 35
    defaultConfig {
        applicationId appId
        minSdk 21
        targetSdk 35
        versionCode appVersion
        versionName "1.0.${appVersion}"
        resValue 'string', 'app_name', appName
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('goolnet.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
