plugins { id 'com.android.application' }
android {
    namespace 'ec.goolnet.radios'
    compileSdk 35
    defaultConfig {
        applicationId 'ec.goolnet.radiosecuador'
        minSdk 21
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('goolnet.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
