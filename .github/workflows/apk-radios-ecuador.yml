name: Armar APK de Radios y TV del Ecuador
on:
  push:
    paths: ['radios-ecuador/**', '.github/workflows/apk-radios-ecuador.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.10.2' }
      - name: Armar APK
        run: |
          cp radios-ecuador/www/index.html radios-ecuador/android/app/src/main/assets/www/index.html
          cd radios-ecuador/android && gradle assembleDebug --no-daemon
      - name: Renombrar
        run: |
          mkdir out
          cp radios-ecuador/android/app/build/outputs/apk/debug/*.apk out/RadiosEcuador.apk
      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: radios-ecuador
          name: Radios y TV del Ecuador (Android)
          make_latest: false
          body: |
            Descarga directa para celulares Android:
            https://github.com/${{ github.repository }}/releases/download/radios-ecuador/RadiosEcuador.apk
          files: out/RadiosEcuador.apk
